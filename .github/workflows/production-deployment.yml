name: Production Deployment CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Allows manual triggering

env:
  RUN_ID: ${{ github.run_id }}
  SHA: ${{ github.sha }}
  REF: ${{ github.ref }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Added overall job timeout
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint mobile (Expo)
        run: npm run mobile:lint

      - name: Typecheck mobile
        run: npm run -w @suki/mobile typecheck

      - name: Check variables
        run: |
          echo "RUN_ID: ${{ env.RUN_ID }}"
          echo "SHA: ${{ env.SHA }}"
          echo "REF: ${{ env.REF }}"

      - name: Docker Prune
        run: docker system prune -af # Removes unused containers, images, volumes, and networks

      # - name: Create ENV File
      #   run: |
      #     touch .env
      #     echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.PROD_NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}" >> .env
      #     echo "CLERK_SECRET_KEY=${{ secrets.PROD_CLERK_SECRET_KEY }}" >> .env
      #     echo "NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_IN_URL }}" >> .env
      #     echo "NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ secrets.NEXT_PUBLIC_CLERK_SIGN_UP_URL }}" >> .env
      #     echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
      #     echo "NEXT_PUBLIC_GOOGLE_PLACE_API_KEY=${{ secrets.NEXT_PUBLIC_GOOGLE_PLACE_API_KEY }}" >> .env
      #     echo "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" >> .env
      #     echo "AZURE_CONTAINER_NAME=${{ secrets.AZURE_CONTAINER_NAME }}" >> .env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # Updated to v4

      - name: Build Docker image
        run: docker build -t suki-app:${{ env.SHA }} -f Dockerfile.vm .

      - name: Run Service
        run: docker compose up -d
