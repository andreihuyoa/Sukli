name: Production Deployment CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: # Allows manual triggering

env:
  RUN_ID: ${{ github.run_id }}
  SHA: ${{ github.sha }}
  REF: ${{ github.ref }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # Added overall job timeout
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        env:
          HUSKY: 0
        run: npm ci

      - name: Lint mobile (Expo)
        run: npm run mobile:lint

      - name: Typecheck mobile
        run: npm run -w @sukli/mobile typecheck

      - name: Check variables
        run: |
          echo "RUN_ID: ${{ env.RUN_ID }}"
          echo "SHA: ${{ env.SHA }}"
          echo "REF: ${{ env.REF }}"

      # Docker build/deploy is disabled for now.
